[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s2-evidencesr"
version = "0.1.0"
description = "Measurement-constrained four-band satellite super-resolution research system"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "numpy>=1.26", "rasterio>=1.4,<1.5", "matplotlib>=3.8", "affine>=3,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
s2sr = "s2_evidencesr.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["training: runs optimizer steps; requires --run-training", "cuda: requires an available CUDA device"]
